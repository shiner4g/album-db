<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Album DB</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #e9ece6;
  --surface: #f8f9f6;
  --ink: #1b2a2f;
  --muted: #5c696c;
  --line: #c9d0ca;
  --primary: #1f5f6b;
  --primary-ink: #ffffff;
  --accent: #c27f00;
  --star: #d4900a;
  --star-off: #cfd5cf;
  --pick-bg: #eaf4fb;
  --danger: #a3352b;
  --track: #d6dcd6;
  --focus: #1f5f6b;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13191b;
    --surface: #1b2326;
    --ink: #e4ebe8;
    --muted: #9aa8aa;
    --line: #2f3b3e;
    --primary: #5fb3c2;
    --primary-ink: #0d1517;
    --accent: #f0b13a;
    --star: #f0b13a;
    --star-off: #3a4649;
    --pick-bg: #1a2e3a;
    --danger: #ec8478;
    --track: #2f3b3e;
    --focus: #5fb3c2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13191b;
  --surface: #1b2326;
  --ink: #e4ebe8;
  --muted: #9aa8aa;
  --line: #2f3b3e;
  --primary: #5fb3c2;
  --primary-ink: #0d1517;
  --accent: #f0b13a;
  --star: #f0b13a;
  --star-off: #3a4649;
  --pick-bg: #1a2e3a;
  --danger: #ec8478;
  --track: #2f3b3e;
  --focus: #5fb3c2;
  color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  font-size: 15px;
  line-height: 1.55;
}
.wrap { max-width: 1080px; margin: 0 auto; padding: 28px 20px 56px; }
header.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
h1 {
  margin: 0;
  font-family: "Noto Serif KR", "Batang", serif;
  font-weight: 700;
  font-size: 34px;
  letter-spacing: -0.02em;
  line-height: 1.15;
}
.status { font-size: 13px; color: var(--muted); }
.status.err { color: var(--danger); }

button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.btn {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 6px;
  padding: 8px 14px;
  min-height: 38px;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); font-weight: 700; }
.btn.danger { color: var(--danger); border-color: var(--danger); }
header.top .btn { font-size: 13px; padding: 4px 10px; min-height: 28px; }
.btn.small { padding: 4px 10px; min-height: 30px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: default; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.actions[hidden] { display: none; }

.toolbar {
  display: grid;
  grid-template-columns: minmax(160px, 2fr) repeat(3, minmax(100px, 1fr)) auto;
  gap: 10px;
  align-items: center;
  margin-bottom: 14px;
}
.field {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 6px;
  padding: 8px 10px;
  min-height: 38px;
  width: 100%;
}
.check { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; color: var(--muted); }
.check input { width: 16px; height: 16px; accent-color: var(--primary); }

.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 18px;
  margin-bottom: 18px;
}
.panel[hidden] { display: none; }
.panel h2 { margin: 0 0 14px; font-size: 17px; font-family: "Noto Serif KR", serif; }
.form-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 12px; }
.form-grid label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
.c-3 { grid-column: span 3; } .c-2 { grid-column: span 2; } .c-4 { grid-column: span 4; } .c-6 { grid-column: span 6; } .c-12 { grid-column: span 12; } .c-8 { grid-column: span 8; }
textarea.field { font: inherit; resize: vertical; min-height: 140px; }
.preview { font-size: 13px; color: var(--muted); margin-top: 10px; }
.preview ul { max-height: 180px; overflow: auto; margin: 6px 0 0; padding-left: 18px; color: var(--ink); }
.preview .bad { color: var(--danger); }
.form-foot { display: flex; align-items: center; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
.msg { color: var(--danger); font-size: 13px; }

.table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 860px; }
th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
tbody tr:last-child td { border-bottom: 0; }
th { font-size: 13px; font-weight: 500; color: var(--muted); white-space: nowrap; }
th button { background: none; border: 0; padding: 0; color: inherit; font-weight: inherit; display: inline-flex; gap: 4px; align-items: center; }
th button[aria-pressed="true"] { color: var(--ink); font-weight: 700; }
.col-year { width: 74px; } .col-rate { width: 170px; } .col-genre { width: 130px; } .col-cat { width: 110px; }

.cat { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; white-space: nowrap; }
.cat i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.rate { display: flex; align-items: center; gap: 8px; }
.stars { display: inline-flex; font-size: 17px; line-height: 1; letter-spacing: 1px; }
.star { display: inline-block; color: var(--star-off); }
@supports ((-webkit-background-clip: text) or (background-clip: text)) {
  .star {
    background: linear-gradient(90deg, var(--star) var(--f, 0%), var(--star-off) var(--f, 0%));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
}
.rate .none { color: var(--muted); }
.chk-slot { display: inline-block; width: 18px; text-align: center; color: var(--primary); font-weight: 700; font-size: 17px; line-height: 1; flex: none; }
.year { font-variant-numeric: tabular-nums; }
.artist { font-size: 13px; color: var(--muted); }
.album { font-family: "Noto Serif KR", "Batang", serif; font-weight: 700; font-size: 16px; line-height: 1.35; }
.comment { color: var(--ink); }
tbody tr.pick { background: var(--pick-bg); }
tbody tr:focus-visible { outline-offset: -2px; }
@media (pointer: coarse) {
  tbody tr { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
}
.btn.primary.armed, .btn.danger.armed { background: var(--danger); border-color: var(--danger); color: var(--surface); }

.empty { padding: 44px 20px; text-align: center; color: var(--muted); }

@media (max-width: 760px) {
  .wrap { padding: 20px 14px 44px; }
  h1 { font-size: 28px; }
  .toolbar { grid-template-columns: 1fr 1fr; }
  .toolbar .search { grid-column: span 2; }
  .form-grid .c-3, .form-grid .c-2, .form-grid .c-4, .form-grid .c-6, .form-grid .c-8 { grid-column: span 12; }
  .form-grid .half { grid-column: span 6; }
  table { min-width: 0; }
  thead { display: none; }
  tbody tr {
    display: grid;
    grid-template-columns: auto 1fr auto;
    grid-template-areas: "title title rate" "year genre cat" "comment comment comment";
    gap: 6px 10px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
  }
  tbody tr:last-child { border-bottom: 0; }
  td { display: block; padding: 0; border: 0; }
  td.t-year { grid-area: year; align-self: center; color: var(--muted); }
  td.t-genre { grid-area: genre; align-self: center; }
  td.t-cat { grid-area: cat; align-self: center; }
  td.t-rate { grid-area: rate; }
  td.t-title { grid-area: title; }
  td.t-comment { grid-area: comment; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Album DB</h1>
    <div class="actions">
      <span class="status" id="status"></span>
      <div class="actions" id="actionGroup" hidden>
        <button class="btn primary" id="btnAdd" type="button">앨범 추가</button>
        <button class="btn" id="btnImport" type="button">가져오기</button>
        <button class="btn" id="btnBulk" type="button">장르 일괄 수정</button>
        <button class="btn" id="btnExport" type="button" hidden>내보내기</button>
      </div>
      <button class="btn" id="btnMenu" type="button" aria-expanded="false" aria-controls="actionGroup">펼치기 ▾</button>
    </div>
  </header>

  <section class="panel" id="formPanel" hidden aria-labelledby="formTitle">
    <h2 id="formTitle">앨범 추가</h2>
    <div class="form-grid">
      <label class="c-2 half">구분
        <input class="field" id="fCat" list="catList" placeholder="솔로, 그룹, 라이브 등" maxlength="30">
        <datalist id="catList"></datalist>
      </label>
      <label class="c-3 half">장르
        <input class="field" id="fGenre" list="genreList" placeholder="예: 퓨전 재즈, 포스트밥" maxlength="40">
        <datalist id="genreList"></datalist>
      </label>
      <label class="c-2 half">별점 (5점 만점)
        <select class="field" id="fRate"></select>
      </label>
      <label class="c-2 half">연도
        <input class="field" id="fYear" type="number" min="1900" max="2100" inputmode="numeric" placeholder="1975">
      </label>
      <label class="c-3 half" style="justify-content:flex-end">
        <span class="check" style="padding-bottom:8px"><input type="checkbox" id="fSig"> 대표앨범으로 표시</span>
      </label>
      <label class="c-4">아티스트
        <input class="field" id="fArtist" maxlength="80">
      </label>
      <label class="c-4">앨범 제목
        <input class="field" id="fTitle" maxlength="120">
      </label>
      <label class="c-4">한줄평
        <input class="field" id="fComment" maxlength="200">
      </label>
    </div>
    <div class="form-foot">
      <button class="btn primary" id="btnSave" type="button">저장</button>
      <button class="btn" id="btnCancel" type="button">취소</button>
      <button class="btn danger" id="btnDelete" type="button" hidden>삭제</button>
      <span class="msg" id="formMsg" role="alert"></span>
    </div>
  </section>

  <section class="panel" id="importPanel" hidden aria-labelledby="importTitle">
    <h2 id="importTitle">가져오기</h2>
    <div class="form-grid">
      <label class="c-4">아티스트 (표에 아티스트 열이 없을 때만 입력)
        <input class="field" id="iArtist" maxlength="80" placeholder="예: Pat Metheny">
      </label>
      <label class="c-8">파일에서 불러오기 (.tsv, .txt)
        <input class="field" id="iFile" type="file" accept=".tsv,.txt,text/tab-separated-values,text/plain">
      </label>
      <label class="c-12">목록 붙여넣기 (탭으로 구분, 첫 줄이 열 이름이면 열 위치를 자동 인식)
        <textarea class="field" id="iText" rows="8" spellcheck="false"></textarea>
      </label>
    </div>
    <div class="preview" id="iPreview" aria-live="polite"></div>
    <div class="form-foot">
      <button class="btn primary" id="btnImportSave" type="button" disabled>저장</button>
      <button class="btn" id="btnImportCancel" type="button">닫기</button>
      <span class="msg" id="iMsg" role="alert"></span>
    </div>
  </section>

  <section class="panel" id="bulkPanel" hidden aria-labelledby="bulkTitle">
    <h2 id="bulkTitle">장르 일괄 수정</h2>
    <div class="preview" id="bInfo" style="margin:0 0 12px"></div>
    <div class="form-grid">
      <label class="c-4">변경할 장르
        <input class="field" id="bGenre" list="genreList" maxlength="40" placeholder="비워 두면 장르를 지웁니다">
      </label>
      <label class="c-8" style="justify-content:flex-end">
        <span class="check" style="padding-bottom:8px"><input type="checkbox" id="bEmptyOnly"> 장르가 비어 있는 앨범만 변경</span>
      </label>
    </div>
    <div class="form-foot">
      <button class="btn primary" id="btnBulkApply" type="button" disabled>적용</button>
      <button class="btn" id="btnBulkClose" type="button">닫기</button>
      <span class="msg" id="bMsg" role="alert"></span>
      <span class="preview" id="bDone" style="margin:0" aria-live="polite"></span>
    </div>
  </section>

  <div class="toolbar">
    <input class="field search" id="q" type="search" placeholder="아티스트, 제목, 한줄평 검색" aria-label="검색">
    <select class="field" id="fltGenre" aria-label="장르 필터"></select>
    <select class="field" id="fltCat" aria-label="구분 필터"></select>
    <select class="field" id="fltRating" aria-label="별점 필터">
      <option value="0">별점 전체</option>
      <option value="5">★★★★★</option>
      <option value="4">★★★★</option>
      <option value="3">★★★</option>
      <option value="2">★★</option>
      <option value="1">★</option>
    </select>
    <label class="check"><input type="checkbox" id="fltSig"> 대표앨범만</label>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th class="col-year"><button type="button" data-sort="year" aria-pressed="false">연도</button></th>
          <th><button type="button" data-sort="artist" aria-pressed="false">제목</button></th>
          <th class="col-rate"><button type="button" data-sort="rating" aria-pressed="false">별점</button></th>
          <th class="col-genre"><button type="button" data-sort="genre" aria-pressed="false">장르</button></th>
          <th class="col-cat"><button type="button" data-sort="category" aria-pressed="false">구분</button></th>
          <th>한줄평</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getFirestore, collection, doc, addDoc, setDoc, deleteDoc, onSnapshot, writeBatch } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDVFY0a9gzaqkJENaSmSfgaDx342iInJmU",
  authDomain: "album-db-e978e.firebaseapp.com",
  projectId: "album-db-e978e",
  storageBucket: "album-db-e978e.firebasestorage.app",
  messagingSenderId: "679432111393",
  appId: "1:679432111393:web:d7daff92e9229f29f42a60"
};

(function () {
  "use strict";
  var DEFAULT_CATS = ["솔로", "그룹", "협업", "라이브", "컴필레이션", "OST"];
  var PALETTE = ["#1f7a8c", "#b5651d", "#6a4c93", "#3a7d44", "#b23a48", "#4a6fa5", "#8a7a1f"];

  var $ = function (id) { return document.getElementById(id); };
  var fs = null, unsub = null;
  var albums = [], loaded = false;
  var canWrite = true;
  var editingId = null, saving = false;
  var sort = { key: null, dir: "asc" };  // key가 null이면 기본 순서(아티스트 → 연도)
  var delTimer = null;
  var lastCatKey = "", lastGenreKey = "", lastArtist = "";

  // 별점 선택지 0.5 ~ 5.0
  (function () {
    var sel = $("fRate");
    for (var v = 5; v >= 0.5; v -= 0.5) {
      var o = document.createElement("option");
      o.value = String(v); o.textContent = fmtRate(v);
      sel.appendChild(o);
    }
    var o0 = document.createElement("option"); o0.value = ""; o0.textContent = "평가 보류"; sel.appendChild(o0);
    sel.value = "4";
  })();

  function fmtRate(n) { return (Math.round(n * 2) % 2 === 0) ? String(Math.round(n)) : n.toFixed(1); }
  function catColor(c) {
    var h = 0; for (var i = 0; i < c.length; i++) h = (h * 31 + c.charCodeAt(i)) >>> 0;
    return PALETTE[h % PALETTE.length];
  }
  function setStatus(t, err) { var s = $("status"); s.textContent = t; s.className = "status" + (err ? " err" : ""); }

  // ---------- 목록 그리기 ----------
  function visible() {
    var q = $("q").value.trim().toLowerCase();
    var gen = $("fltGenre").value, cat = $("fltCat").value, minR = parseFloat($("fltRating").value) || 0, sig = $("fltSig").checked;
    var list = albums.filter(function (a) {
      if (cat && a.category !== cat) return false;
      if (gen === "__none__") { if (a.genre) return false; }
      else if (gen && a.genre !== gen) return false;
      if (minR && !(a.rating != null && a.rating >= minR)) return false;
      if (sig && !a.signature) return false;
      if (q) {
        var hay = ((a.artist || "") + " " + (a.title || "") + " " + (a.comment || "") + " " + (a.genre || "")).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
    var k = sort.key, d = sort.dir === "desc" ? -1 : 1;
    function cmpStr(x, y) { return String(x || "").localeCompare(String(y || ""), "ko"); }
    // 기본 순서: 아티스트 → 연도 (같은 아티스트·연도면 등록 순서)
    function byDefault(a, b) {
      return cmpStr(a.artist, b.artist) || ((a.year || 0) - (b.year || 0)) || ((a.createdAt || 0) - (b.createdAt || 0));
    }
    list.sort(function (a, b) {
      var r = 0;
      if (k === "rating") r = (a.rating || 0) - (b.rating || 0);
      else if (k === "year") r = (a.year || 0) - (b.year || 0);
      else if (k === "category") r = cmpStr(a.category, b.category);
      else if (k === "genre") r = cmpStr(a.genre, b.genre);
      else if (k === "artist") r = cmpStr(a.artist, b.artist);
      if (r !== 0) return r * d;
      return byDefault(a, b);
    });
    return list;
  }

  function fillSelect(sel, firstLabel, values, key, setKey) {
    var joined = values.join("\u0001");
    if (joined === key) return key;
    var cur = sel.value;
    sel.textContent = "";
    var o0 = document.createElement("option"); o0.value = ""; o0.textContent = firstLabel; sel.appendChild(o0);
    values.forEach(function (v) { var o = document.createElement("option"); o.value = v; o.textContent = v; sel.appendChild(o); });
    sel.value = values.indexOf(cur) >= 0 ? cur : "";
    return joined;
  }

  function starsEl(r) {
    var wrap = document.createElement("span"); wrap.className = "stars";
    wrap.setAttribute("role", "img"); wrap.setAttribute("aria-label", "별점 " + fmtRate(r) + "점"); wrap.title = fmtRate(r) + "점";
    for (var i = 0; i < 5; i++) {
      var f = Math.max(0, Math.min(1, r - i));
      var st = document.createElement("span"); st.className = "star"; st.textContent = "★";
      st.style.setProperty("--f", (f * 100) + "%");
      wrap.appendChild(st);
    }
    return wrap;
  }

  function td(cls) { var c = document.createElement("td"); c.className = cls; return c; }

  function render() {
    var cats = {};
    albums.forEach(function (a) { if (a.category) cats[a.category] = 1; });
    var catList = Object.keys(cats).sort(function (x, y) { return x.localeCompare(y, "ko"); });
    lastCatKey = fillSelect($("fltCat"), "구분 전체", catList, lastCatKey);

    var gset = {}, hasNoGenre = false;
    albums.forEach(function (a) { if (a.genre) gset[a.genre] = 1; else hasNoGenre = true; });
    var genreNames = Object.keys(gset).sort(function (x, y) { return x.localeCompare(y, "ko"); });
    var gKey = genreNames.join("\u0001") + (hasNoGenre ? "\u0002" : "");
    if (gKey !== lastGenreKey) {
      var gsel = $("fltGenre"), gcur = gsel.value;
      gsel.textContent = "";
      var g0 = document.createElement("option"); g0.value = ""; g0.textContent = "장르 전체"; gsel.appendChild(g0);
      genreNames.forEach(function (g) { var o = document.createElement("option"); o.value = g; o.textContent = g; gsel.appendChild(o); });
      if (hasNoGenre) { var gn = document.createElement("option"); gn.value = "__none__"; gn.textContent = "장르 없음"; gsel.appendChild(gn); }
      gsel.value = (gcur === "__none__" ? hasNoGenre : gset[gcur]) ? gcur : "";
      lastGenreKey = gKey;
    }

    var dl = $("catList"); dl.textContent = "";

  // 길게 누르면(0.55초) 수정 창 열기. 스크롤 중이거나 손가락이 움직이면 취소.
  function attachLongPress(tr, a) {
    var timer = null, sx = 0, sy = 0, fired = false;
    function cancel() { clearTimeout(timer); timer = null; }
    tr.addEventListener("pointerdown", function (e) {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      fired = false; sx = e.clientX; sy = e.clientY; cancel();
      timer = setTimeout(function () {
        timer = null; fired = true;
        if (navigator.vibrate) { try { navigator.vibrate(15); } catch (x) {} }
        openForm(a);
      }, 550);
    });
    tr.addEventListener("pointermove", function (e) {
      if (timer && (Math.abs(e.clientX - sx) > 10 || Math.abs(e.clientY - sy) > 10)) cancel();
    });
    ["pointerup", "pointercancel", "pointerleave"].forEach(function (n) { tr.addEventListener(n, cancel); });
    tr.addEventListener("contextmenu", function (e) { if (fired || timer) e.preventDefault(); });
    tr.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && e.target === tr) { e.preventDefault(); openForm(a); }

  function csvCell(v) { var s = String(v == null ? "" : v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
  async function exportCsv() {
    var rows = [["구분", "별점", "대표앨범", "장르", "연도", "아티스트", "제목", "한줄평"]];

  // ---------- 일괄 가져오기 ----------
  var importRows = [];
  // 첫 줄이 열 이름이면(연도/아티스트/제목/별점/대표/구분/한줄평) 그 순서대로 열을 인식하고 그 줄은 건너뜁니다.
  var HEAD_ALIASES = {
    year: ["연도", "년도", "발매연도", "year"],
    artist: ["아티스트", "가수", "뮤지션", "artist"],
    title: ["제목", "앨범", "앨범명", "앨범제목", "title", "album"],
    rating: ["별점", "평점", "rating"],
    pick: ["대표", "대표앨범", "pick"],
    category: ["구분", "분류", "category"],
    genre: ["장르", "genre"],
    comment: ["한줄평", "코멘트", "비고", "메모", "comment"]
  };
  function normCell(v) { return String(v || "").replace(/\s+/g, "").toLowerCase(); }
  function headerMap(cols) {
    var map = {}, hits = 0;
    cols.forEach(function (c, i) {
      var n = normCell(c);
      Object.keys(HEAD_ALIASES).forEach(function (k) {
        if (map[k] == null && HEAD_ALIASES[k].indexOf(n) >= 0) { map[k] = i; hits++; }
      });
    });
    return hits >= 2 ? map : null;
  }
  function cleanCell(v) {
    v = String(v == null ? "" : v).trim();
    if (v.length >= 2 && v.charAt(0) === '"' && v.charAt(v.length - 1) === '"') v = v.slice(1, -1).replace(/""/g, '"').trim();
    return v;
  }
  function isPick(v) {
    v = String(v || "").trim();
    if (!v) return false;
    if (/[★✓√✔○●]/.test(v)) return true;
    return ["y", "yes", "true", "1", "o", "대표", "pick"].indexOf(v.toLowerCase()) >= 0;
  }
  function parseImport(text, defArtist) {
    var rows = [], errors = [], map = null, started = false;
    text.split(/\r?\n/).forEach(function (line, i) {
      if (!line.trim()) return;
      var cols = (line.indexOf("\t") >= 0 ? line.split("\t") : line.split(/\s{2,}/)).map(cleanCell);
      var hm = headerMap(cols);
      if (hm) { if (!started) map = hm; return; }
      if (!started) {
        started = true;
        if (!map) {
          // 열 이름이 없을 때: 첫 칸이 4자리 연도면 연도/아티스트/제목/별점/대표/구분/한줄평, 아니면 구분/별점/연도/제목/한줄평
          map = /^\d{4}$/.test(cols[0])
            ? { year: 0, artist: 1, title: 2, rating: 3, pick: 4, category: 5, comment: 6 }
            : { category: 0, rating: 1, year: 2, title: 3, comment: 4 };
        }
      }
      var n = (i + 1) + "번째 줄";
      function g(k) { return map[k] == null ? "" : (cols[map[k]] || ""); }
      var year = parseInt(g("year"), 10);
      if (isNaN(year) || year < 1900 || year > 2100) { errors.push(n + ": 연도를 읽을 수 없습니다 (" + g("year") + ")"); return; }
      var title = g("title");
      if (!title) { errors.push(n + ": 제목이 비어 있습니다"); return; }
      var artist = g("artist") || defArtist;
      if (!artist) { errors.push(n + ": 아티스트가 없습니다 (표에 아티스트 열이 없으면 위 입력란에 입력하세요)"); return; }
      var rateRaw = g("rating"), rateTxt = rateRaw.replace(/[★✓√✔\s]/g, "").replace(/점$/, ""), rating = null;
      if (rateTxt !== "" && rateTxt !== "-") {
        rating = parseFloat(rateTxt);
        if (isNaN(rating) || rating < 0.5 || rating > 5 || Math.round(rating * 2) !== rating * 2) { errors.push(n + ": 별점을 읽을 수 없습니다 (" + rateRaw + ")"); return; }
      }
      rows.push({
        category: g("category") || "기타", genre: g("genre"), rating: rating, year: year, artist: artist, title: title,
        comment: g("comment"), signature: /[★✓√✔]/.test(rateRaw) || isPick(g("pick"))
      });
    });
    return { rows: rows, errors: errors };
  }
  function dupKey(a) { return [a.artist, a.title, a.year].join("|").toLowerCase(); }

  function updateImportPreview() {
    var artist = $("iArtist").value.trim(), text = $("iText").value;
    var box = $("iPreview"); box.textContent = ""; $("iMsg").textContent = "";
    importRows = []; $("btnImportSave").disabled = true; $("btnImportSave").textContent = "저장";
    if (!text.trim()) return;
    var res = parseImport(text, artist);
    var have = {}; albums.forEach(function (a) { have[dupKey(a)] = 1; });
    var seen = {};
    var fresh = res.rows.filter(function (r) { var k = dupKey(r); if (have[k] || seen[k]) return false; seen[k] = 1; return true; });
    importRows = fresh;
    var head = document.createElement("div");
    head.textContent = res.rows.length + "장 인식, 중복 " + (res.rows.length - fresh.length) + "장 제외, 저장 대상 " + fresh.length + "장";
    box.appendChild(head);
    if (res.errors.length) {
      var eu = document.createElement("ul"); eu.className = "bad";
      res.errors.forEach(function (m) { var li = document.createElement("li"); li.textContent = m; eu.appendChild(li); });
      box.appendChild(eu);
    }
    if (fresh.length) {
      var ul = document.createElement("ul");
      fresh.forEach(function (r) {
        var li = document.createElement("li");
        li.textContent = r.year + "  " + r.artist + " - " + r.title + "  (" + r.category + (r.genre ? ", " + r.genre : "") + ", " + (r.rating == null ? "평가 보류" : fmtRate(r.rating)) + (r.signature ? " ✓" : "") + ")";
        ul.appendChild(li);
      });
      box.appendChild(ul);
      $("btnImportSave").disabled = false;
      $("btnImportSave").textContent = fresh.length + "장 저장";
    }
  }

  async function runImport() {
    if (saving || !importRows.length) return;
    if (!fs) { $("iMsg").textContent = "DB에 연결되지 않아 저장할 수 없습니다."; return; }
    saving = true; $("btnImportSave").disabled = true; $("iMsg").textContent = "";
    var rows = importRows.slice(), done = 0, base = Date.now();
    try {
      for (var i = 0; i < rows.length; i += 400) {
        var batch = writeBatch(fs);
        rows.slice(i, i + 400).forEach(function (r, j) {
          var d = Object.assign({}, r); d.createdAt = base + i + j;
          batch.set(doc(collection(fs, "albums")), d);
        });
        await batch.commit();
        done += Math.min(400, rows.length - i);
      }
      $("iText").value = ""; updateImportPreview();
      $("iPreview").textContent = done + "장을 저장했습니다.";
    } catch (e) {
      $("iMsg").textContent = (done ? done + "장 저장 후 중단되었습니다. " : "") + errText(e);

    } finally { saving = false; }
  }

  // ---------- 장르 일괄 수정 ----------
  // 대상 = 현재 목록에 보이는 앨범 (검색·필터로 범위를 좁힌 뒤 적용)
  var bulkTimer = null, bulkArmedCount = 0;
  function bulkTargets() {
    var v = $("bGenre").value.trim(), emptyOnly = $("bEmptyOnly").checked;
    return visible().filter(function (a) { return (!emptyOnly || !a.genre) && (a.genre || "") !== v; });
  }
  function disarmBulk() { clearTimeout(bulkTimer); $("btnBulkApply").classList.remove("armed"); updateBulk(); }
  function updateBulk() {
    if ($("bulkPanel").hidden) return;
    var shown = visible().length, t = bulkTargets(), v = $("bGenre").value.trim(), btn = $("btnBulkApply");
    $("bInfo").textContent = "현재 목록에 보이는 앨범 " + shown + "장이 범위입니다 (검색·필터로 범위를 좁힐 수 있습니다). 그중 변경 대상은 " + t.length + "장입니다.";
    if (btn.classList.contains("armed") && bulkArmedCount !== t.length) { clearTimeout(bulkTimer); btn.classList.remove("armed"); }
    if (!btn.classList.contains("armed")) {
      btn.textContent = !t.length ? "변경할 앨범 없음" : (v ? t.length + "장의 장르를 ‘" + v + "’(으)로 변경" : t.length + "장의 장르 비우기");
    }

  async function applyBulk() {
    if (!fs || saving) return;
    var btn = $("btnBulkApply"), t = bulkTargets();

    if (!btn.classList.contains("armed")) {   // 첫 번째 클릭: 확인 단계

    clearTimeout(bulkTimer); btn.classList.remove("armed");
    var v = $("bGenre").value.trim(), done = 0;
    saving = true; btn.disabled = true; $("bMsg").textContent = ""; $("bDone").textContent = "";
    try {
      for (var i = 0; i < t.length; i += 400) {
        var batch = writeBatch(fs);
        t.slice(i, i + 400).forEach(function (a) { batch.update(doc(fs, "albums", a.id), { genre: v }); });
        await batch.commit();
        done += Math.min(400, t.length - i);
      }
      $("bDone").textContent = done + "장의 장르를 " + (v ? "‘" + v + "’(으)로 변경했습니다." : "비웠습니다.");
    } catch (e) {

    } finally { saving = false; updateBulk(); }

  var sortBtns = document.querySelectorAll("th button[data-sort]");

      var on = x.getAttribute("data-sort") === sort.key;
      x.setAttribute("aria-pressed", on ? "true" : "false");
      x.textContent = x.getAttribute("data-label") + (on ? (sort.dir === "asc" ? " ▲" : " ▼") : "");
    });
  }
  sortBtns.forEach(function (b) {
    b.addEventListener("click", function () {
      var k = b.getAttribute("data-sort");
      if (sort.key !== k) { sort.key = k; sort.dir = "asc"; }
      else if (sort.dir === "asc") sort.dir = "desc";
      else { sort.key = null; sort.dir = "asc"; }
      paintSort(); render();
    });
  });

  // ---------- 시작 ----------
  render();
  if (firebaseConfig.apiKey.indexOf("YOUR_") === 0) {
    loaded = true; setStatus("firebaseConfig 값을 먼저 입력하세요", true); render(); return;
  }
  var app = initializeApp(firebaseConfig);
  fs = getFirestore(app);
  unsub = onSnapshot(collection(fs, "albums"), function (snap) {
    albums = snap.docs.map(function (d) { var o = Object.assign({}, d.data()); o.id = d.id; return o; });
    loaded = true; setStatus(""); render();
  }, function (e) {
    loaded = true;
    setStatus(e && e.code === "permission-denied" ? "읽기가 거부되었습니다. Firestore 규칙을 확인하세요" : "DB 연결이 끊어졌습니다. 새로고침하세요.", true);
    render();
  });
})();
</script>
</body>
</html>
